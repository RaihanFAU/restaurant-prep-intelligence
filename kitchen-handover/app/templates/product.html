{% extends "base.html" %}
{% block title %} · {{ product.name_de }}{% endblock %}
{% block content %}
<h1>{{ product.name_de }}</h1>
<p class="breadcrumb">
    <a href="/stations/{{ product.station.id }}">{{ product.station.name }}</a>
    {% if product.section %} → {{ product.section.name }}{% endif %}
</p>

<button class="big-button primary"
        hx-post="/products/{{ product.id }}/prepare-tomorrow"
        hx-headers='{"X-CSRF-Token": "{{ request.state.csrf_token }}"}'
        hx-target="#prepare-feedback"
        hx-swap="innerHTML">
    {{ t.prepare_tomorrow_button }}
</button>

<div id="prepare-feedback"></div>
{% endblock %}
