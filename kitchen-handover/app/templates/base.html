<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>{{ t.app_name }}{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    <header class="app-header">
        <a href="/" class="app-name">{{ t.app_name }}</a>
        {% if current_user %}
            <span class="worker-badge">
                {{ t.logged_in_as }}: {{ current_user.display_name }}
                {% if current_user.role.value == "ADMIN" %}· <a href="/admin">{{ t.admin_link }}</a>{% endif %}
                ·
                <form method="post" action="/logout" style="display:inline">
                    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
                    <button type="submit" class="link-button">{{ t.logout_button }}</button>
                </form>
            </span>
        {% endif %}
    </header>
    <main class="app-main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
