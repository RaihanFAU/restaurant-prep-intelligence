{% extends "base.html" %}
{% block title %} · Login{% endblock %}
{% block content %}
<h1>{{ t.admin_login_heading }}</h1>

{% if error %}
<div class="error-banner">{{ error }}</div>
{% endif %}

<form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">

    <label for="email">{{ t.email_label }}</label>
    <input type="email" id="email" name="email" required autocomplete="username" autofocus>

    <label for="password">{{ t.password_label }}</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">

    <button class="big-button primary" type="submit">{{ t.login_button }}</button>
</form>

<p><a href="/worker-login">{{ t.worker_login_link_label }}</a></p>
{% endblock %}
